name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BoxPilot
        uses: actions/checkout@v4
        with:
          path: boxpilot
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: boxpilot/go.mod
          cache-dependency-path: boxpilot/go.sum
      - name: Check formatting and static analysis
        working-directory: boxpilot
        env:
          CGO_ENABLED: 0
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
          go run github.com/egoist/mygo/cmd/mygo@latest vet .
      - name: Run race detector
        working-directory: boxpilot
        env:
          CGO_ENABLED: 1
        run: go test -race -timeout=3m ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: .exe
          - goos: windows
            goarch: arm64
            ext: .exe
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - name: Check out BoxPilot
        uses: actions/checkout@v4
        with:
          path: boxpilot
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: boxpilot/go.mod
          cache-dependency-path: boxpilot/go.sum
      - name: Install UPX
        if: matrix.goos == 'linux' || matrix.goos == 'windows'
        run: |
          sudo apt-get update
          sudo apt-get install --yes upx-ucl
      - name: Build and package with MyGo
        working-directory: boxpilot
        env:
          CGO_ENABLED: 0
        run: |
          go run github.com/egoist/mygo/cmd/mygo@latest build \
            -platform "${{ matrix.goos }}/${{ matrix.goarch }}" \
            -skip-installer -skip-dmg \
            -o "dist" .
          if [ "${{ matrix.goos }}" = linux ] || \
            { [ "${{ matrix.goos }}" = windows ] && [ "${{ matrix.goarch }}" != arm64 ]; }; then
            binary=$(find "dist/${{ matrix.goos }}-${{ matrix.goarch }}" -maxdepth 1 -type f \
              \( -iname 'boxpilot' -o -iname 'boxpilot.exe' \) -print -quit)
            if [ -z "$binary" ]; then
              echo "MyGo executable not found in dist/${{ matrix.goos }}-${{ matrix.goarch }}"
              exit 1
            fi
            upx --best --lzma "$binary"
          fi
      - name: Stage release packages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: boxpilot-${{ matrix.goos }}-${{ matrix.goarch }}
          path: boxpilot/dist/${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          retention-days: 1

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out BoxPilot
        uses: actions/checkout@v4
      - name: Download release binaries
        uses: actions/download-artifact@v4
        with:
          pattern: boxpilot-*
          path: dist
          merge-multiple: true
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: dist/boxpilot-*
          fail_on_unmatched_files: true
          overwrite_files: true
