name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out BoxPilot
        uses: actions/checkout@v4
        with:
          path: boxpilot
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: boxpilot/go.mod
          cache-dependency-path: boxpilot/go.sum
      - name: Check formatting and static analysis
        working-directory: boxpilot
        env:
          CGO_ENABLED: 0
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
          go vet ./...
          go run github.com/egoist/mygo/cmd/mygo@latest vet .
      - name: Run race detector
        working-directory: boxpilot
        env:
          CGO_ENABLED: 1
        run: go test -race -timeout=3m ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out BoxPilot
        uses: actions/checkout@v4
        with:
          path: boxpilot
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: boxpilot/go.mod
          cache-dependency-path: boxpilot/go.sum
      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install --yes upx-ucl
      - name: Build binaries with MyGo
        working-directory: boxpilot
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p release-assets
          for target in linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            go run github.com/egoist/mygo/cmd/mygo@latest build \
              -platform "$target" \
              -skip-installer -skip-dmg \
              -o "dist" .

            binary=$(find "dist/${goos}-${goarch}" -maxdepth 1 -type f \
              \( -iname 'boxpilot' -o -iname 'boxpilot.exe' \) -print -quit)
            if [ -z "$binary" ]; then
              echo "MyGo executable not found in dist/${goos}-${goarch}"
              exit 1
            fi

            if [ "$goos" = linux ] || \
              { [ "$goos" = windows ] && [ "$goarch" != arm64 ]; }; then
              upx --best --lzma "$binary"
            fi

            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
              asset_name="boxpilot-${goos}-${goarch}"
              if [ "$goos" = windows ]; then
                asset_name="$asset_name.exe"
              fi
              cp "$binary" "release-assets/$asset_name"
            fi
          done
      - name: Upload binaries to GitHub Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: true
          files: boxpilot/release-assets/*
          fail_on_unmatched_files: true
          overwrite_files: true
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
